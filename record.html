<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>BLK44 · Voice note</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --ink:#141414; --muted:#6b6b6b; --line:#dcdcd8; --bad:#b3261e; --ok:#2f6b3a; --bg:#fff; --soft:#f4f4f1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  header img { height: 44px; margin: -6px 0; }
  header .p { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
  h1 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; background: var(--ink); color: #fff; display: inline-block; padding: 6px 12px; margin: 0 0 12px; }
  .note { font-size: 13px; padding: 8px 10px; background: #fbf3e6; color: #8a5a00; margin-bottom: 12px; }
  .btn { display: block; width: 100%; border: 1px solid var(--ink); background: #fff; color: var(--ink); font: 600 14px/1 inherit; letter-spacing: 2px; text-transform: uppercase; padding: 16px; margin-top: 10px; text-align: center; cursor: pointer; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.rec { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn:disabled { opacity: .5; }
  .timer { font: 600 40px/1 ui-monospace, Menlo, monospace; text-align: center; margin: 14px 0 4px; }
  .timer.on { color: var(--bad); }
  .small { font-size: 13px; color: var(--muted); }
  textarea { width: 100%; min-height: 170px; border: 1px solid var(--line); padding: 10px; font: 15px/1.45 inherit; margin-top: 6px; }
  label.lbl { display: block; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  .seg { display: flex; gap: 6px; margin-top: 6px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: #fff; padding: 10px; font: 13px inherit; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pics span { position: relative; } .pics img { width: 72px; height: 72px; object-fit: cover; display: block; }
  .pics b { position: absolute; top: -6px; right: -6px; background: #fff; border: 1px solid var(--line); width: 22px; height: 22px; line-height: 20px; text-align: center; border-radius: 11px; font-size: 13px; }
  .live { min-height: 3em; padding: 10px; background: var(--soft); margin-top: 10px; font-size: 15px; }
  .live i { color: var(--muted); font-style: normal; }
  .msg { margin-top: 12px; font-size: 14px; } .msg.bad { color: var(--bad); } .msg.ok { color: var(--ok); }
  input[type=file] { display: none; }
</style>
</head>
<body>
<main>
  <header><img src="apple-touch-icon.png" alt="BLK44"><div class="p" id="proj"></div></header>
  <h1>Voice note</h1>
  <div class="note">Bago mag-record ng usapan, sabihin sa kausap na nire-record ito.</div>
  <label class="lbl">Wika ng sasabihin</label>
  <div class="seg" id="lang"><button class="on" data-v="fil-PH">Tagalog / Taglish</button><button data-v="en-PH">English</button></div>
  <div class="timer" id="tm">0:00</div><div class="small" style="text-align:center">hanggang 5 minuto bawat note</div>
  <button class="btn primary" id="rb">● Record</button>
  <div class="live" id="live"><i>Lalabas dito ang sinasabi mo.</i></div>
  <label class="lbl">Text (puwedeng i-edit)</label>
  <textarea id="tx" placeholder="Dito lalabas ang text. Kung walang lumabas, i-type o gamitin ang mic ng keyboard."></textarea>
  <label class="lbl">Mga picture</label>
  <label class="btn" style="margin-top:6px">+ Kunan ng picture<input type="file" accept="image/*" capture="environment" id="cam"></label>
  <label class="btn" style="margin-top:6px">+ Galing sa Photos<input type="file" accept="image/*" multiple id="lib"></label>
  <div class="pics" id="pics"></div>
  <button class="btn primary" id="sv" disabled>I-save sa app</button>
  <div class="msg" id="msg"></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), T = q.get('t') || '', API = q.get('a') || '', P = q.get('p') || '';
  var $ = function (id) { return document.getElementById(id); };
  $('proj').textContent = P ? P : '';
  if (!T || !/^https:\/\/script\.google\.com\//.test(API)) { $('msg').className = 'msg bad'; $('msg').textContent = 'Buksan ang recorder mula sa app (Voice notes → Record).'; $('rb').disabled = true; }
  var lang = 'fil-PH', st = null, blob = null, secs = 0, photos = [];
  document.querySelectorAll('#lang button').forEach(function (b) { b.onclick = function () { document.querySelectorAll('#lang button').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); lang = b.dataset.v; }; });
  function msg(t, c) { $('msg').className = 'msg ' + (c || ''); $('msg').textContent = t; }
  function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  async function start() {
    var stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { return msg('Hindi mabuksan ang mic. Payagan ang microphone (Settings → Safari → Microphone). ' + (e.message || ''), 'bad'); }
    var mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'].filter(function (m) { return window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); })[0] || '';
    var mr; try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : { audioBitsPerSecond: 48000 }); } catch (e) { stream.getTracks().forEach(function (t) { t.stop(); }); return msg('Hindi kaya ng phone na mag-record dito.', 'bad'); }
    st = { stream: stream, mr: mr, parts: [], t0: Date.now(), finals: $('tx').value ? [$('tx').value.trim()] : [], mime: (mr.mimeType || mime || 'audio/mp4').split(';')[0] };
    mr.ondataavailable = function (e) { if (e.data && e.data.size) st.parts.push(e.data); };
    mr.onstop = function () { blob = new Blob(st.parts, { type: st.mime }); secs = Math.round((Date.now() - st.t0) / 1000); stream.getTracks().forEach(function (t) { t.stop(); }); clearInterval(st.timer);
      $('tx').value = st.finals.join(' ').trim(); $('rb').textContent = '● Record ulit (papalitan ang audio)'; $('rb').className = 'btn'; $('tm').className = 'timer'; $('sv').disabled = false;
      msg('Na-record: ' + fmt(secs) + ' · ' + (blob.size / 1048576).toFixed(1) + ' MB. I-check ang text, magdagdag ng picture, tapos I-save.', 'ok'); st = null; };
    mr.start(1000);
    $('rb').textContent = '■ Stop'; $('rb').className = 'btn rec'; $('tm').className = 'timer on'; $('sv').disabled = true; msg('');
    st.timer = setInterval(function () { var s = Math.round((Date.now() - st.t0) / 1000); $('tm').textContent = fmt(s); if (s >= 300) stop(); }, 300);
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      var sr = st.sr = new SR(); sr.lang = lang; sr.continuous = true; sr.interimResults = true;
      sr.onresult = function (ev) { var interim = ''; for (var i = ev.resultIndex; i < ev.results.length; i++) { var r = ev.results[i]; if (r.isFinal) st.finals.push(r[0].transcript.trim()); else interim += r[0].transcript; }
        $('live').innerHTML = esc(st.finals.join(' ')) + ' <i>' + esc(interim) + '</i>'; };
      sr.onerror = function (e) { if (st && !st.finals.length) $('live').innerHTML = '<i>Walang live text (' + esc(e.error || '') + '). Nire-record pa rin ang audio; i-type o i-dictate pagkatapos.</i>'; };
      sr.onend = function () { if (st && st.sr === sr) { try { sr.start(); } catch (e) {} } };
      try { sr.start(); $('live').innerHTML = '<i>Nakikinig…</i>'; } catch (e) {}
    } else $('live').innerHTML = '<i>Walang live text sa browser na ito. Nire-record pa rin ang audio; i-type o i-dictate pagkatapos.</i>';
  }
  function stop() { if (!st) return; var sr = st.sr; st.sr = null; try { sr && sr.stop(); } catch (e) {} setTimeout(function () { try { st && st.mr.stop(); } catch (e) {} }, 600); }
  $('rb').onclick = function () { if (st) stop(); else start(); };
  function addPics(inp) { Array.prototype.slice.call(inp.files || []).forEach(function (f) { var img = new Image(), url = URL.createObjectURL(f);
      img.onload = function () { var W = Math.min(1280, img.width), H = Math.round(img.height * W / img.width), c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(img, 0, 0, W, H);
        photos.push(c.toDataURL('image/jpeg', 0.75)); URL.revokeObjectURL(url); drawPics(); if (!st) $('sv').disabled = false; }; img.src = url; }); inp.value = ''; }
  function drawPics() { $('pics').innerHTML = photos.map(function (p, i) { return '<span><img src="' + p + '"><b data-i="' + i + '">×</b></span>'; }).join('');
    $('pics').querySelectorAll('b').forEach(function (b) { b.onclick = function () { photos.splice(+b.dataset.i, 1); drawPics(); }; }); }
  $('cam').onchange = function () { addPics(this); }; $('lib').onchange = function () { addPics(this); };
  $('tx').oninput = function () { if (!st && this.value.trim()) $('sv').disabled = false; };
  async function post(o) { o.ticket = T; var r = await fetch(API, { method: 'POST', body: JSON.stringify(o) }); var j = await r.json(); if (!j.ok) throw new Error(j.error || 'Error'); return j.data; }
  function b64(b) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1] || ''); }; r.onerror = rej; r.readAsDataURL(b); }); }
  $('sv').onclick = async function () {
    var tx = $('tx').value.trim(); if (!blob && !tx && !photos.length) return msg('Walang laman', 'bad');
    $('sv').disabled = true; $('rb').disabled = true;
    try {
      var audio = null;
      if (blob) { var s0 = await post({ op: 'start', size: blob.size, mime: blob.type }), off = 0, res = null;
        while (off < blob.size) { var part = blob.slice(off, off + s0.chunk); msg('Ina-upload ang audio… ' + Math.round(off / blob.size * 100) + '%');
          res = await post({ op: 'chunk', uid: s0.uid, offset: off, data: await b64(part) }); off += part.size; if (res.done) break; }
        if (!res || !res.done) throw new Error('Hindi natapos ang upload ng audio'); audio = res; }
      var urls = []; for (var i = 0; i < photos.length; i++) { msg('Ina-upload ang picture ' + (i + 1) + ' sa ' + photos.length + '…'); urls.push((await post({ op: 'photo', photo: photos[i] })).url); }
      msg('Sine-save…');
      await post({ op: 'finish', transcript: tx, audioUrl: audio ? audio.url : '', audioId: audio ? audio.id : '', secs: secs, photos: urls });
      blob = null; photos = []; drawPics(); $('tx').value = ''; $('live').innerHTML = '<i>Lalabas dito ang sinasabi mo.</i>'; $('tm').textContent = '0:00'; $('rb').textContent = '● Record'; $('rb').className = 'btn primary';
      msg('✓ Na-save sa app. Bumalik sa app (Voice notes → I-refresh), o mag-record ulit.', 'ok');
    } catch (e) { msg('Hindi na-save: ' + (e.message || e) + '. Pindutin ulit ang I-save.', 'bad'); $('sv').disabled = false; }
    $('rb').disabled = false;
  };
})();
</script>
</body>
</html>
